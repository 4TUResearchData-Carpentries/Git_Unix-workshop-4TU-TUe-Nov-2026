project:
  type: default
  output-dir: _site
  render:
    - "*.qmd"

# Shared options for every deck in this repository.
# Per-deck files only need a `title` and `subtitle`.
format:
  revealjs:
    theme: [default, styles.scss]
    logo: images/shared/logo.png
    slide-number: true
    transition: slide
    center: true
    width: 1280
    height: 720
    preview-links: auto
