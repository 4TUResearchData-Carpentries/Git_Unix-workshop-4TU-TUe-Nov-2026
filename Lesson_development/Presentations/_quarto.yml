project:
  type: default
  output-dir: _site
  # copied as-is into the built site (the brand fonts used by fonts.css)
  resources:
    - fonts/
  # Every .qmd file in this folder is rendered, so a new deck needs no registration here.
  # README.md is not a .qmd file, so it is left out. To skip a draft, add a line such as
  #   - "!draft-*.qmd"
  render:
    - "*.qmd"

format:
  revealjs:
    theme: [default, styles.scss]
    css: fonts.css          # @font-face rules for Aspekta and Space Grotesk
    slide-number: true
    chalkboard: false
    hash: true
    transition: fade
    highlight-style: a11y   # accessible code colours, readable on the Off White code background
    footer: "TRAINING NAME / ORGANISATION"
    # logo: img/logo.png   # uncomment and add your logo; positioned by .slide-logo in styles.scss

